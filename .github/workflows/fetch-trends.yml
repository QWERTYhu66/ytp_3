name: Refresh trending data

on:
  schedule:
    # Every 6 hours: 02:00, 08:00, 14:00, 20:00 UTC
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  fetch-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch trending data
        run: node scripts/fetch-trends.js
        env:
          # Add YOUTUBE_API_KEY in Settings → Secrets → Actions
          # Reddit works with no credentials
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/trending_fetched.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: refresh trending data" && git push
